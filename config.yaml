params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Dr. Ankit Deshmukh: Research in computational hydrology, geospatial AI, drought analytics, and Earth observation. Using machine learning for environmental sustainability."
  author: Ankit Deshmukh

  defaultTheme: dark
  # disableThemeToggle: true
  ShowShareButtons: true
  ShareButtons: ["linkedin", "twitter"] # To customize which share buttons to be enabled on page
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  comments: true
  images: ["Site-Cover.jpg"]
  label:
    text: Ankit Deshmukh
    icon: /Logo.png
    iconHeight: 35

  profileMode:
    enabled: true
    title: "Ankit Deshmukh, Ph.D."
    subtitle: Computational Hydrology • Geospatial Intelligence  • Hydroclimatic Extremes • Optimization
    imageUrl: "Avatar.jpg"
    imageTitle: Profile picture of Dr. Ankit Deshmukh
    imageWidth: 160
    imageHeight: 160
    buttons:
      - name: "My Web Apps"
        url: /avocation/mywebapps/
      - name: "Avocation"
        url: /avocation/
      - name: "Updates"
        url: research/updates/

  homeInfoParams:
    Title: "Dr. Ankit Deshmukh"
    Content: >
      Welcome to my blog. I will be posting about my learnings in data visualization, R programming, machine learning, and hydrology. Please give a star on [Github](https://github.com/anixn) if you find value in my work. For collaboration and webinars, reach out to me on [Twitter](https://twitter.com/anix7n).

  socialIcons:
    - name: github
      url: "https://github.com/anixn"
    - name: linkedin
      url: "https://www.linkedin.com/in/anixn/"
    - name: twitter
      url: "https://twitter.com/anix7n"
    - name: youtube
      url: "https://www.youtube.com/@edgeospatial"

  analytics:
    google:
      SiteVerificationTag: "G-R5FJKDQD1M"

  hideFooter: true

  assets:
    # disableHLJS: true # to disable highlight.js
    disableFingerprinting: true
    favicon: "favicon.ico"

outputs:
  home:
    - HTML
    - RSS
    - JSON # is necessary

markup:
  goldmark:
    renderer:
      unsafe: true
